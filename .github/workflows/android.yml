name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle cache ───────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Grant execute permission ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Build release APK (unsigned — signing is done in step 7) ──────────
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 6. Prepare signing keystore ───────────────────────────────────────────
      # If KEYSTORE_BASE64 secret is set, decode it; otherwise generate a CI key.
      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/keystore.jks
            echo "KS_STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KS_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"          >> $GITHUB_ENV
            echo "KS_KEY_PASS=${{ secrets.KEY_PASSWORD }}"        >> $GITHUB_ENV
          else
            echo "No real keystore found — generating a CI test keystore"
            keytool -genkeypair -v \
              -keystore $RUNNER_TEMP/keystore.jks \
              -alias ci_key \
              -keyalg RSA -keysize 2048 -validity 365 \
              -storepass ci_pass -keypass ci_pass \
              -dname "CN=CI Build, OU=CI, O=CI, L=CI, S=CI, C=US" \
              -noprompt
            echo "KS_STORE_PASS=ci_pass" >> $GITHUB_ENV
            echo "KS_KEY_ALIAS=ci_key"   >> $GITHUB_ENV
            echo "KS_KEY_PASS=ci_pass"   >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      # ── 7. Sign APK with apksigner ────────────────────────────────────────────
      - name: Sign APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Found APK: $UNSIGNED_APK"

          # Derive output name by stripping -unsigned suffix (if present)
          SIGNED_APK="${UNSIGNED_APK/-unsigned/}"
          if [ "$SIGNED_APK" = "$UNSIGNED_APK" ]; then
            # No -unsigned suffix — append -signed before .apk
            SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"
          fi

          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)

          $BUILD_TOOLS/apksigner sign \
            --ks "${{ env.KEYSTORE_FILE }}" \
            --ks-pass "pass:${{ env.KS_STORE_PASS }}" \
            --ks-key-alias "${{ env.KS_KEY_ALIAS }}" \
            --key-pass "pass:${{ env.KS_KEY_PASS }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

      # ── 8. Verify signature ───────────────────────────────────────────────────
      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify --verbose "${{ env.SIGNED_APK }}"

      # ── 9. Upload APK artifact ────────────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: remotesync-release
          path: ${{ env.SIGNED_APK }}
          retention-days: 30

      # ── 10. Clean up keystore ─────────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f $RUNNER_TEMP/keystore.jks
